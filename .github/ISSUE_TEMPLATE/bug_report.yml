name: Bug report
description: Report a reproducible problem without sharing personal or health data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, personal session labels, faces, telemetry captures, or health information. This project is a wellness and research prototype, not a clinical measurement system.

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - HEAD-only glasses sender
        - HEAD camera receiver
        - HYBRID head and torso
        - Torso bridge
        - macOS notification receiver
        - macOS menu-bar app
        - Demo mode
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, operating system, browser, and app or deployment version.
      placeholder: Meta Display / macOS 15 / Chrome 140 / commit SHA
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a redacted placeholder instead of a real session label.
      placeholder: |
        1. Open ...?session=REDACTED
        2. Select START HEAD IMU
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include stale/permission/calibration state and sanitized console errors when relevant.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, identifying session labels, faces, and health information.
          required: true
        - label: I understand that the displayed angle is not clinical CVA.
          required: true
